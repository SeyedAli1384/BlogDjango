{% extends "main.html" %}

{% block content %}
<h1>Home Template</h1>

<div>

    <a href="{% url 'create-blog' %}">Create Blog</a>

    <div>
        {% for blg in blog %}
            <div>
                <h5><a href="{% url 'blog' blg.id %}">{{blg.title}} by {{blg.author}}</a></h5>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
