<section class="sidebar-section">
    <h3 class="sidebar-heading">
        <span>Explore Topics</span>
        <span class="sidebar-count">{{ topics|length }}</span>
    </h3>

    <nav class="topic-list" aria-label="Blog topics">
        <a class="topic-link {% if not request.GET.q %}active{% endif %}"
           href="{% url 'home' %}">
            <span>All topics</span>
        </a>

        {% for topic in topics %}
            <a class="topic-link {% if request.GET.q == topic.name %}active{% endif %}"
               href="{% url 'home' %}?q={{ topic.name|urlencode }}">
                <span>{{ topic.name }}</span>
            </a>
        {% empty %}
            <p class="sidebar-empty">No topics available yet.</p>
        {% endfor %}
    </nav>
</section>
