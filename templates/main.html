<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Digi Market</title>
    <link rel='stylesheet' href="{% static 'styles/main.css' %}">
</head>
<body>
    {% include 'navbar.html' %}

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{message}}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <main class="page-container">
        {% block content %}
        
        {% endblock %}
    </main>

    {% include "footer.html" %}
</body>
</html>
